[package]
name = "vajra"
version = "0.1.0"
edition = "2021"
description = "Vajra: A self-hosted programming language — no external compiler dependency"

[dependencies]
# Unicode support for multi-lingual identifiers (Sanskrit, Hindi, Tamil, Arabic, Chinese, etc.)
unicode-segmentation = "1.13.2"
# Error handling
anyhow = "1.0.102"
# CLI argument parsing
clap = { version = "4.6.1", features = ["derive"] }
# Static keyword mapping
lazy_static = "1.5.0"
# For hashing keywords
hashbrown = "0.14.5"
# Pure-Rust object file (COFF/ELF) writer — replaces LLVM's object emitter
object = { version = "0.36", features = ["write"] }
# Pure-Rust PE (Windows EXE) parsing for the linker
goblin = { version = "0.9", default-features = false, features = ["elf32", "elf64", "pe32", "pe64", "endian_fd", "mach32", "mach64", "archive", "te"] }

[lib]
name = "vajra_core"
path = "src/lib.rs"

[[bin]]
name = "vajrac"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
