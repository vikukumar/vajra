[package]
name = "vajra"
version = "0.1.0"
edition = "2021"
description = "Vajra: a Rust-hosted programming language compiler with no external Vajra build toolchain"

[dependencies]
# Unicode support for multi-lingual identifiers (Sanskrit, Hindi, Tamil, Arabic, Chinese, etc.)
unicode-segmentation = "1.13.2"
# Error handling
anyhow = "1.0.102"
# CLI argument parsing
clap = { version = "4.6.1", features = ["derive"] }
# Static keyword mapping
lazy_static = "1.5.0"
# For hashing keywords
hashbrown = "0.14.5"
# object and goblin crates removed — replaced by own COFF/ELF writers in src/assembler/

[lib]
name = "vajra_core"
path = "src/lib.rs"

[[bin]]
name = "vajrac"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
