name: Vajra Compiler Continuous Integration

on:
  push:
    branches: [ initial ]
  pull_request:
    branches: [ initial ]

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Configure GNU Toolchain (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        rustup toolchain install stable-x86_64-pc-windows-gnu --component clippy --component rustfmt
        rustup default stable-x86_64-pc-windows-gnu

    - name: Install LLVM & Clang (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm-19-dev libclang-19-dev clang-19 libpolly-19-dev
        echo "LLVM_SYS_191_PREFIX=/usr/lib/llvm-19" >> $GITHUB_ENV

    - name: Install LLVM & Clang (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install llvm@19
        echo "LLVM_SYS_191_PREFIX=$(brew --prefix llvm@19)" >> $GITHUB_ENV

    - name: Extract Precompiled MSYS2 LLVM 19 (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        tar -xzf llvm_msys64.tar.gz
        cp llvm_msys64/mingw64/bin/llvm-config-real.exe llvm_msys64/mingw64/bin/llvm-config.exe
        cp llvm_msys64/mingw64/bin/libzstd.dll llvm_msys64/mingw64/lib/libzstd.dll.a
        cp llvm_msys64/mingw64/bin/libzstd.dll llvm_msys64/mingw64/lib/libzstd.dll
        cp llvm_msys64/mingw64/bin/libxml2-2.dll llvm_msys64/mingw64/lib/libxml2.dll.a
        cp llvm_msys64/mingw64/bin/libxml2-2.dll llvm_msys64/mingw64/lib/libxml2.dll
        echo "LLVM_SYS_191_PREFIX=$(cygpath -w "$GITHUB_WORKSPACE/llvm_msys64/mingw64")" >> $GITHUB_ENV
        echo "$(cygpath -w "$GITHUB_WORKSPACE/llvm_msys64/mingw64/bin")" >> $GITHUB_PATH

    - name: Verify LLVM installation
      shell: bash
      run: |
        llvm-config --version || true

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Cargo Check (Strict Warning-Free Verification)
      run: cargo check --all-targets --all-features

    - name: Cargo Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run Cargo Test
      run: cargo test --all-features
