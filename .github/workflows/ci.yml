name: Vajra Compiler Continuous Integration

on:
  push:
    branches: [ initial ]
  pull_request:
    branches: [ initial ]

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Configure GNU Toolchain (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        rustup toolchain install stable-x86_64-pc-windows-gnu --component clippy --component rustfmt
        rustup default stable-x86_64-pc-windows-gnu

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Cargo Check (Strict Warning-Free Verification)
      run: cargo check --all-targets --all-features

    - name: Cargo Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run Cargo Test
      run: cargo test --all-features
