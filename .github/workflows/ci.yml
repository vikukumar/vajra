name: Vajra Compiler Continuous Integration

on:
  push:
    branches: [ initial ]
  pull_request:
    branches: [ initial ]

jobs:
  build:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Install LLVM & Clang (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm-19-dev libclang-19-dev clang-19 libpolly-19-dev
        echo "LLVM_SYS_191_PREFIX=/usr/lib/llvm-19" >> $GITHUB_ENV

    - name: Install LLVM & Clang (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install llvm@19
        echo "LLVM_SYS_191_PREFIX=$(brew --prefix llvm@19)" >> $GITHUB_ENV

    - name: Set up MSYS2 (Windows)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: false

    - name: Install MSYS2 LLVM 19 (Windows)
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        pacman -U --noconfirm \
          https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-llvm-libs-19.1.7-1-any.pkg.tar.zst \
          https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-llvm-19.1.7-1-any.pkg.tar.zst

    - name: Configure MSYS2 LLVM paths (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        echo "LLVM_SYS_191_PREFIX=C:/msys64/mingw64" >> $GITHUB_ENV
        echo "C:/msys64/mingw64/bin" >> $GITHUB_PATH

    - name: Verify LLVM installation
      shell: bash
      run: |
        llvm-config --version || true

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Cargo Check (Strict Warning-Free Verification)
      run: cargo check --all-targets --all-features

    - name: Cargo Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run Cargo Test
      run: cargo test --all-features
