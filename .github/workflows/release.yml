name: Vajra Compiler Precompiled Release Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Compiler Release for ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: linux-x86_64
            binary_name: vajrac
            archive_name: vajrac-linux-x86_64.tar.gz
          - os: macos-latest
            target_name: macos-aarch64
            binary_name: vajrac
            archive_name: vajrac-macos-aarch64.tar.gz
          - os: windows-latest
            target_name: windows-x86_64
            binary_name: vajrac.exe
            archive_name: vajrac-windows-x86_64.zip

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Configure GNU Toolchain (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        rustup toolchain install stable-x86_64-pc-windows-gnu
        rustup default stable-x86_64-pc-windows-gnu

    - name: Install LLVM & Clang (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm-19-dev libclang-19-dev clang-19 libpolly-19-dev
        echo "LLVM_SYS_191_PREFIX=/usr/lib/llvm-19" >> $GITHUB_ENV

    - name: Install LLVM & Clang (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install llvm@19
        echo "LLVM_SYS_191_PREFIX=$(brew --prefix llvm@19)" >> $GITHUB_ENV

    - name: Extract Precompiled MSYS2 LLVM 19 (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        tar -xzf llvm_msys64.tar.gz
        echo "LLVM_SYS_191_PREFIX=$(cygpath -w "$GITHUB_WORKSPACE/llvm_msys64/mingw64")" >> $GITHUB_ENV
        echo "$(cygpath -w "$GITHUB_WORKSPACE/llvm_msys64/mingw64/bin")" >> $GITHUB_PATH

    - name: Verify LLVM installation
      shell: bash
      run: |
        llvm-config --version || true

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Compile Release Binary
      run: cargo build --release --locked

    - name: Package Binary Asset (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Compress-Archive -Path target/release/vajrac.exe -DestinationPath ${{ matrix.archive_name }}

    - name: Package Binary Asset (Linux & macOS)
      if: matrix.os != 'windows-latest'
      run: |
        tar -czvf ${{ matrix.archive_name }} -C target/release ${{ matrix.binary_name }}

    - name: Upload Binary to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.archive_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
