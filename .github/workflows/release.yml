name: Vajra Compiler Precompiled Release Builder

on:
  push:
    branches:
      - initial
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Compiler Release for ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_name: linux-x86_64
            binary_name: vajrac
            archive_name: vajrac-linux-x86_64.tar.gz
          - os: macos-latest
            target_name: macos-aarch64
            binary_name: vajrac
            archive_name: vajrac-macos-aarch64.tar.gz
          - os: windows-latest
            target_name: windows-x86_64
            binary_name: vajrac.exe
            archive_name: vajrac-windows-x86_64.zip

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Auto-Detect Project Version
      id: detect_version
      shell: bash
      run: |
        VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f 2)
        MAJOR=$(echo $VERSION | cut -d '.' -f 1)
        MINOR=$(echo $VERSION | cut -d '.' -f 2)
        PATCH=$(echo $VERSION | cut -d '.' -f 3)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "major=$MAJOR" >> $GITHUB_OUTPUT
        echo "minor=$MINOR" >> $GITHUB_OUTPUT
        echo "major_minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT

    - name: Configure GNU Toolchain (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        rustup toolchain install stable-x86_64-pc-windows-gnu --component clippy
        rustup default stable-x86_64-pc-windows-gnu

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Compile Release Binary
      run: cargo build --release

    - name: Package Binary Asset (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Compress-Archive -Path target/release/vajrac.exe -DestinationPath ${{ matrix.archive_name }}

    - name: Package Binary Asset (Linux & macOS)
      if: matrix.os != 'windows-latest'
      run: |
        tar -czvf ${{ matrix.archive_name }} -C target/release ${{ matrix.binary_name }}

    - name: Upload Binary to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ matrix.archive_name }}
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.detect_version.outputs.version) }}
        name: ${{ github.ref_type == 'tag' && github.ref_name || format('Vajra Compiler v{0} (v{1})', steps.detect_version.outputs.version, steps.detect_version.outputs.major_minor) }}
        draft: false
        prerelease: ${{ github.ref_type != 'tag' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
